<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="Tongda industrial banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9d8fb"/>
      <stop offset="1" stop-color="#7fb2e7"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f4b61"/>
      <stop offset="0.5" stop-color="#d6dbe5"/>
      <stop offset="1" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5a00"/>
      <stop offset="0.5" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#8a5a00"/>
    </linearGradient>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="40" height="40" fill="transparent"/>
      <rect width="12" height="40" fill="#ffffff" opacity="0.2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1f3d66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#stripes)"/>

  <g fill="#0a2d61" font-family="Inter, Arial, sans-serif">
    <text x="140" y="140" font-size="64" font-weight="800">WORLD-CLASS QUALITY</text>
    <text x="140" y="206" font-size="38" fill="#c62828" font-weight="700">Zhejiang Makes It Happen</text>
    <text x="140" y="286" font-size="44" font-weight="700">Zhoushan Tongda Plastic Machinery Co., Ltd.</text>

    <circle cx="152" cy="344" r="6" fill="#c62828"/>
    <circle cx="152" cy="392" r="6" fill="#c62828"/>
    <circle cx="152" cy="440" r="6" fill="#c62828"/>

    <text x="175" y="352" font-size="36" font-weight="600">Founded in 1990</text>
    <text x="175" y="400" font-size="36" font-weight="600">Operating 3 Manufacturing Plants</text>
    <text x="175" y="448" font-size="36" font-weight="600">Exporting to 20+ Countries</text>
  </g>

  <g filter="url(#shadow)" transform="translate(760,30) rotate(-23)">
